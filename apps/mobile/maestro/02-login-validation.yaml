appId: com.ordilo.app
---
# The shared flow starts at the signed-out introduction and opens login.
- runFlow: 01-app-gate.yaml
- tapOn: "E-Mail-Adresse"
- inputText: "keine-email"
- hideKeyboard
- scrollUntilVisible:
    element: "Loslegen ohne Passwort"
- tapOn: "Loslegen ohne Passwort"
- assertVisible: "Bitte gültige E-Mail-Adresse eingeben"
