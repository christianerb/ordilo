appId: com.ordilo.app
---
# Login-Validierung: ungültige Adresse → deutsche Fehlermeldung,
# kein Netzwerk-Request, Fokus bleibt im Formular.
- launchApp:
    clearState: true
- tapOn:
    id: "E-Mail-Adresse"
    optional: true
- tapOn: "du@beispiel.de"
- inputText: "keine-email"
- tapOn: "Loslegen — ohne Passwort"
- assertVisible: "Bitte gültige E-Mail-Adresse eingeben"
