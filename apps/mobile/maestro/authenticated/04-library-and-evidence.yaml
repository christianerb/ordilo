appId: com.ordilo.app
---
# Fixture: docs/quality/chat-documents.json, analyzed/confirmed by existing runner.
# This flow creates a real chat in the disposable family and consumes AI quota.
- launchApp
- openLink: "ordilo://ablage"
- tapOn: "Unterlagen durchsuchen"
- inputText: "Elternabend Hannah"
- hideKeyboard
- extendedWaitUntil:
    visible: "Elternabend Hannah, .*"
    timeout: 30000
- scrollUntilVisible:
    element: "Elternabend Hannah, .*"
    visibilityPercentage: 30
    centerElement: true
- tapOn: "Elternabend Hannah, .*"
- scrollUntilVisible:
    element: "Elternabend Hannah"
    visibilityPercentage: 30
    centerElement: true
- assertVisible: "Elternabend Hannah"
- tapOn: "Zurück"
- tapOn: "Ordilo fragen"
- tapOn: "Frage an Ordilo.*"
- inputText: "In welchem Raum findet Hannahs Elternabend statt?"
- tapOn: "Frage senden"
- swipe:
    direction: DOWN
    duration: 500
- hideKeyboard:
    optional: true
- scrollUntilVisible:
    element: "Fundstelle öffnen: Elternabend Hannah.*"
    visibilityPercentage: 30
    centerElement: true
    timeout: 120000
# At maximum Dynamic Type the accessible card is taller than the viewport.
# Tap its visible reading area after centering instead of its offscreen midpoint.
- tapOn:
    point: "50%,60%"
- assertVisible: "Die Fundstelle"
- assertVisible: "Originaltext.*"
- scrollUntilVisible:
    element: ".*B12.*"
    visibilityPercentage: 30
    centerElement: true
- assertVisible: ".*B12.*"
- scrollUntilVisible:
    element: "Zur Dokumentübersicht"
    visibilityPercentage: 30
    centerElement: true
- tapOn: "Zur Dokumentübersicht"
- assertVisible: "Elternabend Hannah"
