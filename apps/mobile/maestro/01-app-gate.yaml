appId: com.ordilo.app
---
# Precondition: signed out through the app, or a dedicated clean simulator.
# clearState alone cannot guarantee that an iOS Keychain session is removed.
- launchApp
- assertVisible: "Ein Brief weniger im Kopf."
- assertVisible: "Deine Familie. Gut organisiert."
- scrollUntilVisible:
    element: "Loslegen"
- tapOn: "Loslegen"
- assertVisible: "Schön, dass du da bist."
- assertVisible: "Loslegen ohne Passwort"
