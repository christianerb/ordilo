name: Job Runner

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

concurrency:
  group: ordilo-background-jobs
  cancel-in-progress: false

jobs:
  run:
    name: Process documents and notifications
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Process documents
        env:
          RUNNER_SECRET: ${{ secrets.JOBS_RUNNER_SECRET }}
          APP_ORIGIN: ${{ vars.VERCEL_DEPLOYMENT_URL || 'https://ordilo-six.vercel.app' }}
        run: |
          curl --fail-with-body --silent --show-error --max-time 310 \
            -X POST -H "Authorization: Bearer $RUNNER_SECRET" \
            -H "Content-Type: application/json" -d '{"limit": 10}' \
            "$APP_ORIGIN/api/jobs/run"
      - name: Process reminders and delivery receipts
        if: ${{ always() }}
        env:
          RUNNER_SECRET: ${{ secrets.JOBS_RUNNER_SECRET }}
          APP_ORIGIN: ${{ vars.VERCEL_DEPLOYMENT_URL || 'https://ordilo-six.vercel.app' }}
        run: |
          curl --fail-with-body --silent --show-error --max-time 310 \
            -H "Authorization: Bearer $RUNNER_SECRET" \
            "$APP_ORIGIN/api/notifications/run"
