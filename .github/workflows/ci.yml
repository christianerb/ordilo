name: CI

on:
  push:
    branches: [main]
  # Every pull request — including stacked PRs whose base is a feature
  # branch — so quality gates run before anything merges, not only after
  # a PR is retargeted to main.
  pull_request:

# Cancel in-progress runs for the same ref (saves CI minutes)
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "22"
  # Next.js build needs no real secrets for lint/typecheck/test.
  # Provide dummy values so build doesn't fail on missing env vars.
  NEXT_PUBLIC_SUPABASE_URL: "https://placeholder.supabase.co"
  NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: "placeholder-publishable-key"
  SUPABASE_SERVICE_ROLE_KEY: "placeholder-service-key"
  OPENAI_API_KEY: "placeholder-openai-key"
  # Sentry SDK gracefully no-ops when DSN is empty, but provide dummy
  # values so withSentryConfig doesn't complain during build.
  NEXT_PUBLIC_SENTRY_DSN: ""
  SENTRY_DSN: ""
  DATALAB_API_KEY: "placeholder-datalab-key"

jobs:
  # ── Quality gate: lint + typecheck + unit tests ──────────────────────
  quality:
    name: Lint, Typecheck & Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm run test

      - name: Mobile lint
        run: npm run lint:mobile

      - name: Mobile typecheck
        run: npm run typecheck:mobile

      - name: Mobile unit tests
        run: npm run test:mobile

  # ── Build gate + E2E smoke: compile once, then boot the BUILT app ────
  # Smoke tests live in the build job so the production build happens
  # exactly once per run instead of twice.
  build:
    name: Next.js Build & E2E Smoke
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright chromium
        run: npx playwright install chromium --with-deps

      - name: Build
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"

      - name: E2E smoke tests
        run: npm run test:e2e

  # Compile the production iOS JavaScript bundle on every change. Native
  # signing and device tests still happen through EAS/TestFlight, but a bad
  # Expo config, Metro plugin or production-only import must fail CI first.
  mobile-bundle:
    name: Mobile Production Bundle
    runs-on: ubuntu-latest
    needs: quality
    env:
      CI: "1"
      EXPO_PUBLIC_SUPABASE_URL: "https://placeholder.supabase.co"
      EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY: "placeholder-publishable-key"
      EXPO_PUBLIC_API_URL: "https://placeholder.ordilo.de"
      EXPO_PUBLIC_SENTRY_DSN: ""
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Export production iOS bundle
        working-directory: apps/mobile
        run: npx expo export --platform ios --output-dir /tmp/ordilo-ios-export

  database-contracts:
    name: Database contracts
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          # Disposable runner-only fixtures contain no application data or secrets.
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 127.0.0.1:5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Verify atomic corrections, RLS and revocation
        run: |
          psql -h 127.0.0.1 -U postgres -d postgres -v ON_ERROR_STOP=1 -f supabase/tests/document_corrections.sql
          psql -h 127.0.0.1 -U postgres -d postgres -v ON_ERROR_STOP=1 -f supabase/tests/family_access.sql
          psql -h 127.0.0.1 -U postgres -d postgres -v ON_ERROR_STOP=1 -f supabase/tests/api_usage.sql
          psql -h 127.0.0.1 -U postgres -d postgres -v ON_ERROR_STOP=1 -f supabase/tests/family_entitlements.sql
          psql -h 127.0.0.1 -U postgres -d postgres -v ON_ERROR_STOP=1 -f supabase/tests/family_entitlements_concurrency.sql
